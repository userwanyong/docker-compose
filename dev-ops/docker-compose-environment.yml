# =====================================================================
# 基础环境编排（生产环境标准配置）
# 命令执行 docker compose -f docker-compose-environment.yml up -d
# 可选执行 docker compose -f docker-compose-environment.yml up -d mysql redis rabbitmq
#
# 本文件遵循的生产约定：
#   1. 所有服务 restart: unless-stopped：异常退出自动重启，宿主机/守护进程重启后自动恢复，
#      手动 docker stop 的容器不会被强制拉起
#   2. 所有服务配置 healthcheck，服务间通过 depends_on: condition: service_healthy
#      保证启动顺序
#   3. 日志统一 json-file 限额滚动（max-size 10m，最多 3 个文件），防止磁盘写满
#   4. 各服务账号密码直接明文写在对应 environment 中，按需自行修改（改密码的注意事项见下）
#
# 特别注意：
#   - elasticsearch 统一使用 elastic 超级用户 + ELASTIC_PASSWORD（默认 123456）：
#     es 首次启动时通过 ELASTIC_PASSWORD 设置密码（替代手动 setup-passwords），
#     kibana / logstash / canal-adapter 直接以 elastic 认证，up 一条命令即可全链路打通。
#   - mysql 首次启动后会执行 ./mysql/sql 下的初始化脚本；./mysql/data 已有数据时
#     不会重复执行，且此时修改 MYSQL_ROOT_PASSWORD 不会生效（需重建数据目录）
#   - milvus 单机版的元数据用独立 etcd 服务（客户端端口 2379），对象存储复用上面的
#     minio 服务（自动创建独立桶 milvus，与业务文件按桶隔离），SDK 连接 19530 端口，
#     鉴权账号 root / 123456（通过 COMMON_SECURITY_DEFAULTROOTPASSWORD 设置，仅首次
#     启动生效，修改密码需重建 ./milvus 元数据目录）；若修改 MINIO_ROOT_PASSWORD 需同步修改 milvus
#   - attu 为 milvus 的官方图形化管理控制台（http://127.0.0.1:8000，登录 root / 123456）
# =====================================================================
services:

  mysql:
    image: mysql:8.0.32
    container_name: mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
    networks:
      - my-network
    ports:
      - "13306:3306"
    volumes:
      - ./mysql/my.cnf:/etc/mysql/conf.d/mysql.cnf
      - ./mysql/data:/var/lib/mysql
      - ./mysql/log:/var/log
      - ./mysql/sql:/docker-entrypoint-initdb.d
    healthcheck:
      # $$ 为 compose 转义，实际在容器内读取环境变量
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:6.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis/data:/data
      - ./redis/logs:/var/log/redis
    logging:
      options:
        max-size: 10m
        max-file: "3"
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      # redis.conf 配置了 requirepass，探活需携带密码认证
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - my-network

  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: canal-server
    restart: unless-stopped
    ports:
      - "11111:11111"
    volumes:
      - ./canal-server/instance.properties:/home/admin/canal-server/conf/example/instance.properties
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat </dev/null >/dev/tcp/127.0.0.1/11111"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
    networks:
      - my-network

  canal-adapter:
    image: dyrnq/canal-adapter:1.1.7
    container_name: canal-adapter
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./canal-adapter/logback.xml:/home/admin/canal-adapter/conf/logback.xml
      - ./canal-adapter/application.yml:/home/admin/canal-adapter/conf/application.yml
      - ./canal-adapter/bootstrap.yml:/home/admin/canal-adapter/conf/bootstrap.yml
      - ./canal-adapter/es7:/home/admin/canal-adapter/conf/es7
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat </dev/null >/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      canal-server:
        condition: service_healthy
    networks:
      - my-network

  # http://127.0.0.1:15672 admin/123456
  rabbitmq:
    image: rabbitmq:3.12.9
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123456
    command: rabbitmq-server
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - my-network

  zookeeper:
    image: zookeeper:3.9.0
    container_name: zookeeper
    restart: unless-stopped
    hostname: zoo1
    ports:
      - "2181:2181"
    environment:
      TZ: Asia/Shanghai
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "zkServer.sh status 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - my-network

  # http://127.0.0.1:9091/xxl-job-admin admin/123456
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: xxl-job-admin
    restart: unless-stopped
    ports:
      - "9091:9090"
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/xxl_job?serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SERVER_PORT: 9090
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat </dev/null >/dev/tcp/127.0.0.1/9090"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - my-network

  elasticsearch:
    image: elasticsearch:7.17.14
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - ./es/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./es/config/log4j2.properties:/usr/share/elasticsearch/config/log4j2.properties
    logging:
      options:
        max-size: 10m
        max-file: "3"
    environment:
      TZ: Asia/Shanghai
      cluster.name: elasticsearch          # 设置集群名称为elasticsearch
      discovery.type: single-node          # 以单一节点模式启动
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"    # 设置使用jvm内存大小
      ELASTIC_PASSWORD: 123456  # 首次启动设置 elastic 用户密码，替代 setup-passwords
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$${ELASTIC_PASSWORD}\" 'http://127.0.0.1:9200/_cluster/health?timeout=5s' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - my-network

  # http://127.0.0.1:5601
  kibana:
    image: kibana:7.17.14
    container_name: kibana
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - '5601:5601'
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200  # 设置访问elasticsearch的地址
      I18N_LOCALE: zh-CN
      LOGGING_QUIET: "true"                         # 等价于只输出 WARN/ERROR
      ELASTICSEARCH_USERNAME: elastic                # 环境变量优先于 kibana.yml 中的同名配置
      ELASTICSEARCH_PASSWORD: 123456
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5601/api/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - my-network

  logstash:
    image: logstash:7.17.14
    container_name: logstash
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - '4560:4560'
      - '50000:50000/tcp'
      - '50000:50000/udp'
      - '9600:9600'
    environment:
      TZ: Asia/Shanghai
      LS_JAVA_OPTS: "-Xms1024m -Xmx1024m"
      ELASTIC_PASSWORD: 123456  # 供 logstash.yml / logstash.conf 中 ${ELASTIC_PASSWORD} 引用
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9600/?pretty' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - my-network

  pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/xfg-studio/pgvector:v0.5.0
    container_name: pgvector
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: postgre
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: ai-rag-knowledge
      PGPASSWORD: 123456
    volumes:
      - ./pgvector/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgre"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my-network

  # 127.0.0.1:8080 nacos/nacos
  nacos:
    image: nacos/nacos-server
    container_name: nacos
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      TZ: Asia/Shanghai
      PREFER_HOST_MODE: hostname
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: 123456
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      NACOS_AUTH_IDENTITY_KEY: 2222
      NACOS_AUTH_IDENTITY_VALUE: 2xxx
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat </dev/null >/dev/tcp/127.0.0.1/8848"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - my-network

  # 数据采集
  prometheus:
    image: bitnami/prometheus:2.47.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat </dev/null >/dev/tcp/127.0.0.1/9090"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - my-network

  # http://127.0.0.1:4000 admin/admin
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./grafana:/etc/grafana
    logging:
      options:
        max-size: 10m
        max-file: "3"
    environment: # 是否配置自己的数据库
      TZ: Asia/Shanghai
      GF_DATABASE_TYPE: mysql
      GF_DATABASE_HOST: mysql:3306
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: root
      GF_DATABASE_PASSWORD: 123456
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4000/api/health || wget -q --spider http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    networks:
      - my-network

  # http://127.0.0.1:9001 minioadmin/12345678  9000为S3 API端口、9001为控制台端口
  minio:
    image: rancher/mirrored-minio-minio:RELEASE.2023-07-07T07-13-57Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: 12345678  # MinIO要求密码至少8位
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    healthcheck:
      # rancher 镜像内无 mc 命令，改用 curl 探测官方 live 健康端点
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - my-network

  # milvus 依赖的元数据存储 etcd（2379为客户端端口，一般仅 milvus 内部访问）
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: etcd
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    ports:
      - "2379:2379"  # 客户端端口，供宿主机排查/运维使用，milvus 仍走容器网络内部
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./etcd/data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - my-network

  # 127.0.0.1:19530 root/123456  19530为SDK gRPC端口、9091为健康检查/指标端口
  milvus:
    image: milvusdb/milvus:v2.6.23
    container_name: milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000            # 复用上面的 minio 服务
      MINIO_ACCESSKEYID: minioadmin        # 与 minio 服务保持一致
      MINIO_SECRETACCESSKEY: 12345678
      MINIO_BUCKETNAME: milvus             # 独立桶，与业务文件按桶隔离，首次启动自动创建
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"  # 开启鉴权
      COMMON_SECURITY_DEFAULTROOTPASSWORD: 123456   # root 初始密码，仅首次启动生效
    ports:
      - "19530:19530"
      - "19091:9091"  # 宿主机 9091 已被 xxl-job-admin 占用，指标端口改为 19091
    volumes:
      - ./milvus/data:/var/lib/milvus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging:
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - my-network

  # http://127.0.0.1:8000 root/123456  Milvus官方图形化管理控制台
  attu:
    image: zilliz/attu:v2.6.5
    container_name: attu
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MILVUS_URL: milvus:19530  # 走容器网络直连 milvus，登录页会自动带出地址
    ports:
      - "8000:3000"
    healthcheck:
      # attu 镜像内无 wget/curl，用自带 node 发起健康探测
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000\",r=>process.exit(r.statusCode<400?0:1)).on(\"error\",()=>process.exit(1))'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

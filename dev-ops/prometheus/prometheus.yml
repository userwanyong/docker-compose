global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'xybjz-app'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8091'  # host.docker.internal 为prometheus在本地docker而xybjz-app服务在本地运行的情况  部署在服务器中应该为ip地址
        labels:
          app: 'xybjz-app'
